# Paints the city as pixel art with a free, open image model (FLUX.1 schnell,
# tools/paint) on GitHub's free runners, in two chessboard passes: pass A
# paints every other tile from the render alone; pass B then paints the rest,
# each seeing its neighbours' finished art at its edges so the painting runs
# on across every join. Every tile is checked against its render and painted
# again if it strayed; water is never painted.
#
# Painted tiles live on the `painted` branch so main stays light; the pages
# workflow publishes them. painters.json there records which painter made
# each tile: bump tools/paint/VERSION to repaint the city, nearest Connaught
# Place first. Runs daily until every tile is current, or by hand.
name: paint

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      per_shard:
        description: Most tiles each of the 16 painters takes in each pass
        default: "30"

concurrency:
  group: paint
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  a:
    uses: ./.github/workflows/paint-pass.yml
    with:
      phase: A
      per_shard: ${{ inputs.per_shard || '30' }}

  b:
    needs: a
    if: always()
    uses: ./.github/workflows/paint-pass.yml
    with:
      phase: B
      per_shard: ${{ inputs.per_shard || '30' }}
