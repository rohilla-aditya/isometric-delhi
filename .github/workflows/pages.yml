# Publishes public/ to GitHub Pages after the tests pass.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Add the AI-painted city tiles
        run: |
          if git ls-remote --exit-code origin refs/heads/painted >/dev/null; then
            git fetch -q --depth=1 origin painted
            mkdir -p public/painted
            git archive origin/painted | tar -x -C public/painted
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
