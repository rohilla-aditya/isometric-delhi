<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isometric Delhi NCR</title>
  <meta name="description" content="An explorable isometric map of Delhi NCR built from every building in OpenStreetMap, with 25 hand-built landmarks, traffic, the metro and day and night.">
  <meta name="theme-color" content="#e9e2d3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 10.5v11L16 29 3 21.5v-11z' fill='%23c2410c'/%3E%3Cpath d='M11 22V13l5-3 5 3v9h-3v-5h-4v5z' fill='%23fff7ed'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map" aria-label="Isometric map of Delhi. Drag to pan, scroll to zoom, click a landmark for details."></canvas>

  <div id="loading" class="loading">
    <div class="loading-mark" aria-hidden="true"></div>
    <p>Laying out Delhi…</p>
  </div>

  <header class="panel title">
    <h1><span class="deva">दिल्ली</span> Isometric Delhi</h1>
    <p>Drag to pan · scroll or pinch to zoom · tap a landmark</p>
    <p class="attrib">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
  </header>

  <aside class="panel places" aria-label="Landmarks">
    <button id="list-toggle" class="list-toggle" type="button">Landmarks</button>
    <h2>Landmarks</h2>
    <ul id="list"></ul>
  </aside>

  <section id="card" class="panel card" hidden aria-live="polite">
    <button id="card-close" class="close" type="button" aria-label="Close">×</button>
    <p id="card-era" class="era"></p>
    <h2 id="card-name"></h2>
    <p id="card-hi" class="deva hi-name"></p>
    <p id="card-text"></p>
  </section>

  <nav class="panel controls" aria-label="Map controls">
    <div class="seg" role="group" aria-label="Time of day">
      <button type="button" data-time="day" aria-pressed="true">Day</button>
      <button type="button" data-time="dusk" aria-pressed="false">Dusk</button>
      <button type="button" data-time="night" aria-pressed="false">Night</button>
    </div>
    <div class="seg" role="group" aria-label="Layers">
      <button type="button" data-toggle="traffic" aria-pressed="true">Traffic</button>
      <button type="button" data-toggle="metro" aria-pressed="true">Metro</button>
      <button type="button" data-toggle="labels" aria-pressed="true">Labels</button>
    </div>
    <div class="seg" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="home" type="button" aria-label="Back to the centre">⌂</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
  </nav>

  <div class="panel minimap-wrap">
    <canvas id="minimap" aria-label="Overview map; click to jump"></canvas>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
